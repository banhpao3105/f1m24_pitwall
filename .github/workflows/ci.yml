# F1 Pit Wall — CI
# Every push/PR into main runs the full gate: lint + typecheck + unit tests
# + production build (next build — catches prerender errors like the v0.5.0
# Vercel failure). Playwright E2E stays out of scope for now.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
