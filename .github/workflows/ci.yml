# F1 Pit Wall — CI (docs/05-ROADMAP-STANDARDS.md Phase 0:
# "CI: lint + typecheck + unit test chạy được")
# Build/Playwright E2E joins in later phases; keep Phase 0 scope tight.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test
